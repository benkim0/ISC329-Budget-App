<!DOCTYPE html>
<html>
<head>
    <title>Accounts</title>
</head>
<body>

<h1>Bank Accounts</h1>

{% with messages = get_flashed_messages() %}
  {% if messages %}
    <ul>
      {% for msg in messages %}
        <li>{{ msg }}</li>
      {% endfor %}
    </ul>
  {% endif %}
{% endwith %}

<hr>

<hr>

<h2>View Account Balance</h2>

<form method="GET" action="/accounts">

    <label>Select Account</label><br>

    <select name="account_id">
        {% for a in accounts %}
            <option value="{{ a.account_id }}"
                {% if selected_account == a.account_id|string %}selected{% endif %}>
                {{ a.bank_name }} (ID {{ a.account_id }})
            </option>
        {% endfor %}
    </select>

    <br><br>

    <button type="submit">View Balance</button>

</form>

{% if balance is not none %}
    <hr>
    <h3>Current Balance:</h3>
    <p>${{ balance }}</p>
{% endif %}

<h2>Create Bank Account</h2>

<form method="POST" action="/add_account">

    <label>Bank Name</label><br>
    <input type="text" name="bank_name" required>
    <br><br>

    <label>Account Number</label><br>
    <input type="number" name="account_number" required>
    <br><br>

    <label>Starting Balance</label><br>
    <input type="number" step="0.01" name="balance" required>
    <br><br>

    <label>Account Type</label><br>
    <input type="text" name="account_type" required>
    <br><br>

    <button type="submit">Create Account</button>

</form>

<a href="/dashboard">
    <button>Return</button>
</a>

</body>
</html>
